<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Requester</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <form>
            <ul>
                <li>
                    <label>Recherche par : </label>
                    <select id="select_type">
                        <option value="titre">Titre</option>
                        <option value="rang">Rang</option>
                        <option value="id">Id</option>
                    </select>
                </li>
                <li>
                    <label>Paramètre : </label>
                    <textarea id="motclef"></textarea>
                </li>
            </ul>
        </form>
        <button class="buttonFormulaire" id="buttonRecherche">Rechercher</button>
        <button class="buttonFormulaire" id="buttonReset">Effacer</button>
    </header>
    <div id = "cards"> 
    </div>
    <script src="https://kit.fontawesome.com/3d8fdb5aea.js" crossorigin="anonymous"></script>
    <script type="module" src="script/script.js"></script>
</body>

</html>
