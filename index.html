<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Requester</title>
    <link rel="stylesheet" href="style/styleLightMode.css">
</head>

<body>
    <header>
        <form>
            <ul>
                <li>
                    <label>Recherche par : </label>
                    <select id="select_type">
                        <option value="titre">Titre</option>
                        <option value="rang">Rang</option>
                        <option value="id">Id</option>
                        <option value="genre">Genre</option>
                    </select>
                </li>
                <li>
                    <label>Paramètre : </label>
                    <input id="motclef">
                </li>
            </ul>
            <ul>
                <li><input type="checkbox" id="Award Winning"> Award Winning</li>
                <li><input type="checkbox" id="Action"> Action</li>
                <li><input type="checkbox" id="Suspense"> Suspense</li>
                <li><input type="checkbox" id="Horror"> Horror</li>
                <li><input type="checkbox" id="Ecchi"> Ecchi</li>
                <li><input type="checkbox" id="Avant Garde"> Avant Garde</li>
                <li><input type="checkbox" id="Sports"> Sports</li>
                <li><input type="checkbox" id="Supernatural"> Supernatural</li>
                <li><input type="checkbox" id="Fantasy"> Fantasy</li>
                <li><input type="checkbox" id="Gourmet"> Gourmet</li>
                <li><input type="checkbox" id="Boys Love"> Boys Love</li>
                <li><input type="checkbox" id="Drama"> Drama</li>
                <li><input type="checkbox" id="Comedy"> Comedy</li>
                <li><input type="checkbox" id="Mystery"> Mystery</li>
                <li><input type="checkbox" id="Girls Love"> Girls Love</li>
                <li><input type="checkbox" id="Slice of Life"> Slice of Life</li>
                <li><input type="checkbox" id="Adventure"> Adventure</li>
                <li><input type="checkbox" id="Romance"> Romance</li>
                <li><input type="checkbox" id="SciFi"> Sci-Fi</li>
                <li><input type="checkbox" id="Erotica"> Erotica</li>
                <li><input type="checkbox" id="Hentai"> Hentai</li>
            </ul>
        </form>
        <button class="buttonFormulaire" id="buttonRecherche">Rechercher</button>
        <button class="buttonFormulaire" id="buttonReset">Effacer</button>
        <button class="button" id="buttonDarkMode"><i class="fa-solid fa-moon"></i> Activez le dark mode</button>
    </header>
    <div id="cards">
    </div>
    <script src="https://kit.fontawesome.com/3d8fdb5aea.js" crossorigin="anonymous"></script>
    <script type="module" src="script/script.js"></script>
</body>

</html>
