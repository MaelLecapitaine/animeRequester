<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Requester</title>
    <link rel="stylesheet" href="style/styleLightMode.css">
</head>

<body>
    <header>
        <form>
            <ul>
                <li>
                    <label for="select_type">Recherche par : </label>
                    <select id="select_type">
                        <option value="titre">Titre</option>
                        <option value="rang">Rang</option>
                        <option value="id">Id</option>
                        <option value="genre">Genre</option>
                    </select>
                </li>
                <li>
                    <label for="motclef">Paramètre : </label>
                    <input id="motclef">
                </li>
            </ul>
            <ul>
                <li><label for="Award_Winning">Award Winning</label><input type="checkbox" id="Award_Winning"></li>
                <li><label for="Action">Action</label><input type="checkbox" id="Action"></li>
                <li><label for="Suspense">Suspense</label><input type="checkbox" id="Suspense"> </li>
                <li><label for="Horror">Horror</label><input type="checkbox" id="Horror"> </li>
                <li><label for="Ecchi">Ecchi</label><input type="checkbox" id="Ecchi"></li>
                <li><label for="Avant_Garde">Avant Garde</label><input type="checkbox" id="Avant_Garde"> </li>
                <li><label for="Sports">Sports</label><input type="checkbox" id="Sports"> </li>
                <li><label for="Supernatural">Supernatural</label><input type="checkbox" id="Supernatural"> </li>
                <li><label for="Fantasy">Fantasy</label><input type="checkbox" id="Fantasy"> </li>
                <li><label for="Gourmet">Gourmet</label><input type="checkbox" id="Gourmet"> </li>
                <li><label for="Boys_Love">Boys Love</label><input type="checkbox" id="Boys_Love"></li>
                <li><label for="Drama">Drama</label><input type="checkbox" id="Drama"> </li>
                <li><label for="Comedy">Comedy</label><input type="checkbox" id="Comedy"> </li>
                <li><label for="Mystery">Mystery</label><input type="checkbox" id="Mystery"> </li>
                <li><label for="Girls_Love">Girls Love</label><input type="checkbox" id="Girls_Love"> </li>
                <li><label for="Slice_of_Life">Slice of Life</label><input type="checkbox" id="Slice_of_Life"></li>
                <li><label for="Adventure">Adventure</label><input type="checkbox" id="Adventure"> </li>
                <li><label for="Romance">Romance</label><input type="checkbox" id="Romance"> </li>
                <li><label for="Sci-Fi">Sci-Fi</label><input type="checkbox" id="Sci-Fi"> </li>
                <li><label for="Erotica">Erotica</label><input type="checkbox" id="Erotica"> </li>
                <li><label for="Hentai">Hentai</label><input type="checkbox" id="Hentai"></li>
            </ul>
        </form>
        <button class="buttonFormulaire" id="buttonRecherche">Rechercher</button>
        <button class="buttonFormulaire" id="buttonReset">Effacer</button>
        <button class="button" id="buttonDarkMode"><em class="fa-solid fa-moon"></em> Activez le dark mode</button>
    </header>
    <div id="cards">
    </div>
    <script src="https://kit.fontawesome.com/3d8fdb5aea.js" crossorigin="anonymous"></script>
    <script type="module" src="script/script.js"></script>
</body>

</html>
